<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiverr Message & AI Safe Guard</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            fiverr: '#1dbf73',
            'fiverr-hover': '#19a463',
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    .dark ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn { animation: fadeIn 0.2s ease-out forwards; }

    /* Natural Walking Cycle */
    @keyframes walkArmL { 0%, 100% { transform: rotate(18deg); } 50% { transform: rotate(-22deg); } }
    @keyframes walkArmR { 0%, 100% { transform: rotate(-22deg); } 50% { transform: rotate(18deg); } }
    @keyframes walkLegL { 0%, 100% { transform: rotate(-18deg); } 50% { transform: rotate(20deg); } }
    @keyframes walkLegR { 0%, 100% { transform: rotate(20deg); } 50% { transform: rotate(-18deg); } }
    @keyframes bodyBob { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }

    .is-walking .robot-head-body { animation: bodyBob 0.55s ease-in-out infinite; }
    .is-walking .arm-l { animation: walkArmL 0.55s ease-in-out infinite alternate; }
    .is-walking .arm-r { animation: walkArmR 0.55s ease-in-out infinite alternate; }
    .is-walking .leg-l { animation: walkLegL 0.55s ease-in-out infinite alternate; }
    .is-walking .leg-r { animation: walkLegR 0.55s ease-in-out infinite alternate; }

    /* Panicked Flailing when dragged */
    @keyframes flailArmL { 0%, 100% { transform: rotate(70deg); } 50% { transform: rotate(-80deg); } }
    @keyframes flailArmR { 0%, 100% { transform: rotate(-80deg); } 50% { transform: rotate(70deg); } }
    @keyframes flailLeg { 0%, 100% { transform: rotate(35deg); } 50% { transform: rotate(-35deg); } }

    .struggling .arm-l { animation: flailArmL 0.1s ease-in-out infinite alternate !important; }
    .struggling .arm-r { animation: flailArmR 0.1s ease-in-out infinite alternate !important; }
    .struggling .leg-l { animation: flailLeg 0.12s ease-in-out infinite alternate !important; }
    .struggling .leg-r { animation: flailLeg 0.12s ease-in-out infinite alternate-reverse !important; }

    /* Parachute Swaying */
    @keyframes parachuteSway { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
    .parachuting { animation: parachuteSway 1.6s ease-in-out infinite alternate; }
  </style>
</head>

<body class="bg-gray-100 dark:bg-[#070b13] text-gray-800 dark:text-gray-100 font-sans min-h-screen flex flex-col transition-colors duration-200 overflow-x-hidden relative select-none">

  <!-- ================= TOP NAVBAR ================= -->
  <header class="w-full bg-white dark:bg-[#0d1424] border-b border-gray-200 dark:border-gray-800 px-4 lg:px-8 py-3.5 flex items-center justify-between sticky top-0 z-40 shadow-sm">
    <div class="flex items-center gap-3">
      <!-- Fiverr Logo -->
      <div class="flex items-center font-black text-2xl tracking-tighter">
        <span class="text-gray-900 dark:text-white text-3xl font-extrabold tracking-tight">fiverr<span class="text-fiverr text-4xl leading-none">.</span></span>
      </div>
      <div class="h-6 w-[2px] bg-gray-300 dark:bg-gray-700 hidden sm:block"></div>
      <span class="text-sm sm:text-base font-semibold text-cyan-600 dark:text-cyan-400 hidden sm:block">
        Fiverr AI Agent & Message Guard
      </span>
